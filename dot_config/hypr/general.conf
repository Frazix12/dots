
source=~/.config/hypr/colors.conf

windowrule = opacity 0.999999, class:zen

layerrule = blur, swaync-control-center
layerrule = blur, swaync-notification-window
# Optional: uncomment these if you have issues with blur not working correctly
layerrule = ignorezero, swaync-control-center
layerrule = ignorezero, swaync-notification-window
layerrule = ignorealpha 0.5, swaync-control-center
layerrule = ignorealpha 0.5, swaync-notification-window

layerrule = blur, waybar
layerrule = ignorezero, waybar
layerrule = ignorealpha 0.5, waybar

layerrule = blur, qs
layerrule = ignorezero, qs
layerrule = ignorealpha 0.1, qs

layerrule = blur, rofi
layerrule = ignorezero, rofi
layerrule = ignorealpha 0.5, rofi

layerrule = blur, walker
layerrule = ignorezero, walker
layerrule = ignorealpha 0.5, walker
# windowrulev2 = opacity 0.2 0.2,class:^(walker)$

layerrule = animation popin, rofi

layerrule = animation slide, waybar

windowrulev2 = float,class:^(org.quickshell)$
windowrulev2 = center,class:^(org.quickshell)$
# windowrulev2 = opacity 0.2 0.2,class:^(org.quickshell)$

input {
    # Keyboard: Add a layout and uncomment kb_options for Win+Space switching shortcut
    kb_layout = us
    # kb_options = grp:win_space_toggle
    numlock_by_default = true
    repeat_delay = 250
    repeat_rate = 35

    special_fallthrough = true
    follow_mouse = 1
}

binds {
    # focus_window_on_workspace_c# For Auto-run stuff see execs.confhange = true
    scroll_event_delay = 0
}

general {
    # Gaps and border
    gaps_in = 3
    gaps_out = 8
    gaps_workspaces = 30
    border_size = 2
    
    # Fallback colors
    col.active_border = $on_surface
    col.inactive_border = $primary

    resize_on_border = true
    no_focus_fallback = true
    layout = dwindle
    
    #focus_to_other_workspaces = true # ahhhh i still haven't properly implemented this
    allow_tearing = true # This just allows the `immediate` window rule to work
}

dwindle {
	preserve_split = true
        # no_gaps_when_only = 1
	smart_split = false
	smart_resizing = false
}

decoration {
    rounding = 6
    active_opacity = 1.0
    inactive_opacity = 0.8
    blur {
        enabled = true
        xray = false
        special = false
        new_optimizations = true
        size = 7
        passes = 3
        brightness = 1
        noise = 0.08
        contrast = 1.5
        popups = true
        ignore_opacity = true
        popups_ignorealpha = 0.6
    }
    # Shadow
    # drop_shadow = true
    # shadow_ignore_window = true
    # shadow_range = 20
    # shadow_offset = 0 2
    # shadow_render_power = 4
    # col.shadow = rgba(0000002A)
    shadow {
        enabled = true
        range = 15
        render_power = 3
        offset = 0, 0
        color = rgba(0000002A)
        # color_inactive = 0xff$baseAlpha
    }
    
    # Shader
    # screen_shader = ~/.config/hypr/shaders/nothing.frag
    # screen_shader = ~/.config/hypr/shaders/vibrance.frag
    
    # Dim
    dim_inactive = false
    dim_strength = 0.1
    dim_special = 0
}

animations {
    enabled = true
    bezier = wind, 0.05, 0.9, 0.1, 1.05
    bezier = winIn, 0.1, 1.1, 0.1, 1.1
    bezier = winOut, 0.3, -0.3, 0, 1
    bezier = liner, 1, 1, 1, 1
    animation = windows, 1, 6, wind, slide
    animation = windowsIn, 1, 6, winIn, slide
    animation = windowsOut, 1, 5, winOut, slide
    animation = windowsMove, 1, 5, wind, slide
    animation = border, 1, 1, liner
    animation = borderangle, 1, 30, liner, loop
    animation = fade, 1, 10, default
    animation = workspaces, 1, 5, wind
}

misc {
    vfr = 1
    vrr = 1
    # layers_hog_mouse_focus = true
    focus_on_activate = true
    animate_manual_resizes = false
    animate_mouse_windowdragging = false
    enable_swallow = false
    swallow_regex = (foot|kitty|allacritty|Alacritty)
    
    disable_hyprland_logo = true
    force_default_wallpaper = 0
    new_window_takes_over_fullscreen = 2
    allow_session_lock_restore = true
    
    initial_workspace_tracking = false
}

# Overview
plugin {
    hyprexpo {
        columns = 3
        gap_size = 5
        bg_col = rgb(000000)
        workspace_method = first 1 # [center/first] [workspace] e.g. first 1 or center m+1

        enable_gesture = false # laptop touchpad, 4 fingers
        gesture_distance = 300 # how far is the "max"
        gesture_positive = false
    }
}